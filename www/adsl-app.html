<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050A1B">
<title>استهلاك الرصيد والمبيعات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>
:root{--bg:#050A1B;--bg2:#0A1230;--sf:#10182F;--bl:#287BFF;--cy:#20C9F5;--tx:#F5F7FF;--mu:#929FBD;--gn:#20D6A0;--rd:#F05275;--am:#FFB84D;--bd:rgba(40,123,255,.2);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:15px/1.55 "IBM Plex Sans Arabic",Cairo,Tahoma,sans-serif;background:radial-gradient(120% 55% at 90% -8%,rgba(40,123,255,.3),transparent 60%),radial-gradient(80% 45% at 0% 35%,rgba(32,201,245,.1),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:18px 16px 180px}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.tp h1{font-size:22px;margin:0;font-weight:700}.tp p{margin:2px 0 16px;color:var(--mu);font-size:13px}
.v{display:none}.v.on{display:block}
.mp{display:flex;align-items:center;justify-content:space-between;padding:6px;margin-bottom:14px;border-radius:22px;background:rgba(16,24,47,.7);border:1px solid var(--bd);backdrop-filter:blur(12px)}
.mp b{font-size:17px}.mp button{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:16px;background:rgba(40,123,255,.14);color:var(--cy)}.mp svg{width:20px;height:20px}
.c{position:relative;margin-bottom:12px;padding:18px;border-radius:26px;border:1px solid var(--bd);background:linear-gradient(160deg,rgba(40,123,255,.16),rgba(16,24,47,.9) 58%);box-shadow:0 22px 44px -26px rgba(22,139,255,.6);backdrop-filter:blur(14px)}
.lb{display:block;color:var(--mu);font-size:13px}.big{font-size:46px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
u{text-decoration:none;font-size:15px;font-weight:600;color:var(--cy);margin-inline-start:6px}.c>p{margin:2px 0 0;color:var(--mu);font-size:13px}
.dg{display:flex;align-items:center;gap:18px;margin-top:16px}.dg svg{width:104px;height:104px;flex:none;filter:drop-shadow(0 0 12px rgba(40,123,255,.4))}
.dg ul{list-style:none;margin:0;padding:0;flex:1}.dg li{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}.dg li i{width:10px;height:10px;border-radius:50%}.dg li b{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.ch{width:100%;height:auto;margin-top:10px;overflow:visible}.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .1s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.sc{padding:14px;border-radius:22px;background:var(--sf);border:1px solid var(--bd)}.sc.w2{grid-column:1/-1}.sc small{display:block;font-size:12px;color:var(--mu);line-height:1.4}.sc b{font-size:21px;font-variant-numeric:tabular-nums}
.ic{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;color:var(--cy);background:linear-gradient(145deg,rgba(40,123,255,.38),rgba(32,201,245,.14))}.ic svg{width:22px;height:22px}.sc .ic{width:36px;height:36px;border-radius:12px;margin-bottom:10px}.sc .ic svg{width:18px;height:18px}
.sec{margin:18px 2px 8px;font-weight:700;font-size:16px}.nt{font-size:12px;color:var(--mu);margin:6px 2px 12px}
.cal{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.cal::-webkit-scrollbar{display:none}
.cal button{flex:none;min-width:38px;height:38px;border-radius:13px;border:1px solid rgba(146,159,189,.18);background:none;color:var(--mu);font-variant-numeric:tabular-nums}
.cal button.on{color:#fff;border-color:transparent;background:linear-gradient(145deg,#287BFF,#20C9F5);box-shadow:0 6px 16px -6px rgba(32,201,245,.7)}.cal .wd{padding:0 14px}
.dy{display:block;width:100%;text-align:start;margin-bottom:10px;padding:14px;border-radius:24px;border:1px solid var(--bd);background:var(--sf)}
.dh{display:flex;align-items:center;justify-content:space-between}.dd{display:grid;place-items:center;width:54px;height:58px;border-radius:18px;background:linear-gradient(145deg,#287BFF,#168BFF 50%,#20C9F5);box-shadow:0 10px 22px -10px rgba(32,201,245,.8)}
.dd b{font-size:22px;line-height:1}.dd small{font-size:10.5px;margin-top:-8px}.dt{text-align:end}.dt small{display:block;font-size:12px;color:var(--mu)}.dt b{font-size:28px;font-variant-numeric:tabular-nums}
.ls3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.l{display:block;padding:10px 6px;border-radius:16px;background:rgba(255,255,255,.04);text-align:center}
.l small{display:block;font-size:11px;color:var(--mu)}.l b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.l em{display:block;font-style:normal;font-size:11px;color:var(--mu);min-height:17px}
.t{display:inline-block;font-style:normal;font-size:10.5px;padding:1px 8px;border-radius:99px}.t.gn{color:var(--gn);background:rgba(32,214,160,.14)}.t.am{color:var(--am);background:rgba(255,184,77,.14)}
.cp{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.cp span{font-size:12px;padding:4px 11px;border-radius:99px;background:rgba(40,123,255,.13);color:var(--mu)}.cp b{color:var(--tx)}
.em{text-align:center;padding:26px 18px}.em p{color:var(--mu);margin:0 0 14px}
.pb,.bt .p{border:0;border-radius:16px;padding:12px 22px;font-weight:700;color:#04101F;background:linear-gradient(135deg,#287BFF,#20C9F5);box-shadow:0 10px 24px -10px rgba(32,201,245,.8)}
.rw{display:grid;grid-template-columns:1fr auto;gap:7px 10px;padding:11px 0}.rw+.rw{border-top:1px solid rgba(146,159,189,.1)}.rw small{color:var(--mu);margin-inline-start:8px;font-size:12px}.rw em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.rw s{grid-column:1/-1;height:6px;border-radius:9px;background:rgba(146,159,189,.14);overflow:hidden}.rw s i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#287BFF,#20C9F5)}.rw.z{opacity:.45}
.it{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px;margin-bottom:10px;border-radius:22px;background:var(--sf);border:1px solid var(--bd)}
.it.rd .ic{color:var(--rd);background:rgba(240,82,117,.14)}.tx{flex:1}.tx b,.tx small{display:block}.tx small{color:var(--mu);font-size:12px}.cv{color:var(--mu)}.cv svg{width:18px;height:18px}
#dock{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;z-index:5}
#nav{display:flex;gap:4px;padding:8px;border-radius:30px;background:rgba(10,18,48,.8);border:1px solid var(--bd);backdrop-filter:blur(18px);box-shadow:0 18px 40px -10px rgba(0,0,0,.7),0 0 34px -10px rgba(40,123,255,.5)}
#nav button{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 0;border:0;border-radius:22px;background:none;color:var(--mu);font-size:12px;font-weight:600}#nav svg{width:24px;height:24px}
#nav button.on{color:var(--cy);background:rgba(32,201,245,.1);box-shadow:0 0 24px -6px rgba(32,201,245,.65)}
.fab{position:absolute;inset-inline-end:6px;bottom:calc(100% + 14px);display:grid;place-items:center;width:60px;height:60px;border:0;border-radius:50%;color:#fff;background:linear-gradient(145deg,#287BFF,#20C9F5);box-shadow:0 14px 30px -8px rgba(32,201,245,.75)}.fab svg{width:28px;height:28px}.fab[hidden]{display:none}
dialog{margin:auto auto 0;width:100%;max-width:560px;max-height:90vh;padding:0;border:1px solid var(--bd);border-bottom:0;border-radius:30px 30px 0 0;background:linear-gradient(180deg,#10182F,#0A1230);color:var(--tx);box-shadow:0 -24px 60px rgba(22,139,255,.25)}
dialog[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}dialog::backdrop{background:rgba(3,6,18,.72);backdrop-filter:blur(4px)}
#frm{padding:22px 18px calc(26px + env(safe-area-inset-bottom,0px))}dialog h2{margin:0 0 4px;font-size:19px}.hd{font-size:13px;color:var(--cy);font-weight:700;margin:16px 0 2px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}input{width:100%;font:inherit;padding:12px 14px;border-radius:15px;border:1px solid rgba(146,159,189,.22);background:rgba(255,255,255,.04);color:var(--tx)}input:focus{border-color:var(--cy);box-shadow:0 0 0 3px rgba(32,201,245,.15);outline:0}
.bt{display:flex;gap:8px;margin-top:20px}.bt button{flex:1;padding:13px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);font-weight:700}.bt .p{border:0}
.lgl{font-size:12px;color:var(--mu);padding:7px 0;border-bottom:1px solid rgba(146,159,189,.12);direction:ltr;text-align:start}
#toast{position:fixed;inset-inline:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));max-width:360px;margin:0 auto;padding:12px;border-radius:18px;background:rgba(16,24,47,.95);border:1px solid var(--cy);color:var(--tx);text-align:center;opacity:0;transition:.3s;pointer-events:none;z-index:9;box-shadow:0 0 28px -6px rgba(32,201,245,.5)}#toast.on{opacity:1}
.tp{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}.tp h1{font-size:18px}.tp p{margin:2px 0 0}
.mb{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:16px;border:1px solid var(--bd);background:rgba(16,24,47,.85);color:var(--cy);font-weight:600;font-size:14px}.mb svg{width:18px;height:18px}.mb[hidden]{display:none}
.hs{display:flex;gap:10px;margin-top:14px}.hs span{flex:1;display:block;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);font-size:12px;color:var(--mu)}.hs b{display:block;font-size:17px;color:var(--tx);font-variant-numeric:tabular-nums}.dg>div{flex:1}
.lg{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--mu)}.lg span{display:inline-flex;align-items:center}.lg i{width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
.kc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.kc span{display:block;padding:8px 2px;border-radius:14px;background:rgba(255,255,255,.05);text-align:center}.kc small{display:block;font-size:10.5px;color:var(--mu)}.kc b{font-size:16px;font-variant-numeric:tabular-nums}
.dy{cursor:pointer}.dt b{font-size:22px}.dt.sl b{color:var(--cy)}.dt u{font-size:12px;margin-inline-start:3px}.dy .kc{margin-top:10px}
.vb2{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;border:1px solid var(--bd);background:rgba(40,123,255,.14);color:var(--cy);font-size:12px;font-weight:600}.vb2 svg{width:15px;height:15px}
.rw{cursor:pointer}.rw em small{display:block;margin:0;font-size:11px;font-weight:400;text-align:end}
.pe{display:inline-grid;place-items:center;width:26px;height:26px;margin-inline-start:8px;border:0;border-radius:9px;background:rgba(40,123,255,.16);color:var(--cy);vertical-align:middle}.pe svg{width:14px;height:14px}
.dr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(146,159,189,.12)}.dr b small{display:block;font-weight:400;font-size:11px;color:var(--mu);text-align:end}.dr span small{color:var(--mu);margin-inline-start:6px}
.yr{display:flex;align-items:center;justify-content:space-between;margin:14px 0}.yr b{font-size:20px}.yr button{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:16px;background:rgba(40,123,255,.14);color:var(--cy)}.yr svg{width:20px;height:20px}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mg button{padding:14px 0;border-radius:16px;border:1px solid rgba(146,159,189,.2);background:none;font-weight:600}.mg .hv{border-color:rgba(32,201,245,.55)}.mg .on{border-color:transparent;background:linear-gradient(145deg,#287BFF,#20C9F5);color:#04101F}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top .big{font-size:40px}.top .hs{margin-top:10px}.top .hs span{padding:8px 12px}
.gz{position:relative;flex:none;width:128px;height:128px;border:0;padding:0;border-radius:50%;background:none;color:var(--cy);filter:drop-shadow(0 0 10px rgba(32,201,245,.35))}.gz svg{width:100%;height:100%;transform:rotate(-90deg)}.gz .tk{stroke:rgba(146,159,189,.16)}.gz .pg{stroke:currentColor}
.gv{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.2}.gv b{font-size:26px;color:var(--tx);font-variant-numeric:tabular-nums}.gv small{font-size:12px;color:var(--mu)}
.gz.lo{color:var(--rd);animation:pl 1.6s ease-in-out infinite}.gz.lo .gv b,.gz.lo .gv small{color:var(--rd)}@keyframes pl{0%,100%{filter:drop-shadow(0 0 8px rgba(240,82,117,.5))}50%{filter:drop-shadow(0 0 22px rgba(240,82,117,.95))}}
#al{position:fixed;inset-inline:12px;top:calc(10px + env(safe-area-inset-top,0px));max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:linear-gradient(135deg,#B8243F,#F05275);color:#fff;font-weight:600;font-size:14px;box-shadow:0 14px 34px -10px rgba(240,82,117,.7);z-index:20;transform:translateY(-160%);transition:transform .35s}#al.on{transform:none}#al button{margin-inline-start:auto;flex:none;border:0;background:rgba(255,255,255,.22);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px}
.sh{display:flex;align-items:center;gap:10px}.sh .ic{margin:0;width:34px;height:34px;flex:none}.sn{font-size:14px;font-weight:600;line-height:1.35;color:var(--tx)}.sv{display:block;margin-top:10px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.program-state{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;font-style:normal}.program-state.am{color:var(--am);background:rgba(255,184,77,.14);border:1px solid rgba(255,184,77,.25)}.program-state.gn{color:var(--gn);background:rgba(32,214,160,.14);border:1px solid rgba(32,214,160,.25)}.program-state.muted{color:var(--mu);background:rgba(146,159,189,.1)}
.kx{display:flex;align-items:center;justify-content:space-between;gap:12px}.kx>div{max-width:46%}.kx .kc{flex:1;margin:0;grid-template-columns:repeat(3,1fr)}.kx .kc span{padding:6px 2px}.kx .kc b{font-size:15px}.cp{margin-top:12px}
@media (prefers-reduced-motion:reduce){.gz.lo{animation:none}#al{transition:none}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}dialog[open]{animation:none}button{transition:none}}
.rs{margin-top:14px;padding:12px 14px;border-radius:18px;border:1px solid var(--bd);background:rgba(255,255,255,.04);font-size:13px;line-height:1.7}.rs.ok{border-color:rgba(32,214,160,.45)}.rs.er{border-color:rgba(240,82,117,.45)}.rs b{display:block;font-size:14px}.rs.ok b{color:var(--gn)}.rs.er b{color:var(--rd)}.rs .wn{color:var(--am);margin-top:6px}.rs .mt{color:var(--mu);margin-top:8px}.rs dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0}.rs dt{color:var(--mu)}.rs dd{margin:0;direction:ltr;text-align:start;overflow-wrap:anywhere}.rs small{display:block;margin-top:6px;color:var(--mu);direction:ltr;text-align:start;overflow-wrap:anywhere}

/* Sales dashboard */
.sale-hero{overflow:hidden;position:relative;padding:20px;border-radius:26px;border:1px solid rgba(32,201,245,.22);background:radial-gradient(120% 120% at 100% 0%,rgba(32,201,245,.22),transparent 52%),linear-gradient(145deg,rgba(40,123,255,.2),rgba(16,24,47,.96) 68%);box-shadow:0 22px 44px -28px rgba(32,139,255,.72)}
.sale-hero:after{content:"";position:absolute;width:170px;height:170px;left:-78px;bottom:-110px;border:1px solid rgba(32,201,245,.13);border-radius:50%;box-shadow:0 0 0 18px rgba(32,201,245,.025),0 0 0 38px rgba(32,201,245,.02);pointer-events:none}
.sale-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;position:relative;z-index:1}
.sale-caption{display:block;color:var(--mu);font-size:13px}
.sale-total{display:block;margin-top:2px;font-size:42px;line-height:1.2;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sale-period{margin:5px 0 0;color:var(--mu);font-size:12px}
.sale-mark{width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:18px;color:var(--cy);background:linear-gradient(145deg,rgba(40,123,255,.4),rgba(32,201,245,.15));border:1px solid rgba(32,201,245,.17)}
.sale-mark svg{width:27px;height:27px}
.sale-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px;position:relative;z-index:1}
.sale-kpi{min-width:0;padding:11px 9px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.045)}
.sale-kpi small{display:block;color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sale-kpi b{display:block;margin-top:4px;font-size:17px;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sale-kpi em{display:block;margin-top:2px;color:var(--mu);font-size:10px;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sale-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 2px 9px}
.sale-section-head .sec{margin:0}
.sale-count{font-size:11px;color:var(--cy);padding:4px 9px;border-radius:99px;background:rgba(32,201,245,.1)}
.sale-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:8px;text-align:start;border-radius:19px;border:1px solid var(--bd);background:linear-gradient(110deg,rgba(40,123,255,.09),rgba(16,24,47,.94) 55%)}
.sale-date{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.sale-day{display:grid;place-items:center;width:43px;height:45px;flex:none;border-radius:14px;background:rgba(40,123,255,.16);color:var(--cy);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sale-date-text{min-width:0}.sale-date-text b,.sale-date-text small{display:block}.sale-date-text b{font-size:13px}.sale-date-text small{color:var(--mu);font-size:11px;direction:ltr;text-align:right}
.sale-amount{flex:none;text-align:end;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--gn)}
.sale-arrow{flex:none;color:var(--mu)}.sale-arrow svg{width:17px;height:17px}
.sale-empty{padding:25px 18px;text-align:center;border:1px dashed rgba(146,159,189,.25);border-radius:22px;background:rgba(16,24,47,.55)}
.sale-empty .ic{margin:0 auto 10px}.sale-empty b{display:block}.sale-empty p{font-size:12px;color:var(--mu);margin:5px 0 14px}

  r=await window.ADSL_LINK.syncCards({host:$('rh').value,port:$('rp').value,user:$('ru').value,password:$('rw').value,state:window.ADSL_APP.getState()});
  if(r.ok){
    const previous=window.ADSL_APP.getState();
    const attemptedAt=new Date().toISOString();
    if(dbStatus?.migrated){
      const days=Object.entries(r.state.d||{}).filter(([,e])=>e&&e.lb!=null&&e.p!=null).map(([day,e])=>({day,entry:{p:e.p,lb:e.lb,c:Array.isArray(e.c)?e.c:[0,0,0,0,0],lp:!!e.lp,lr:e.lr||r.readOn,lx:Number.isInteger(e.lx)?e.lx:0}}));
      const saved=await fetch('/db/router-sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({days,attemptedAt,status:'ok',readOn:r.readOn,dateSource:r.dateSource,summary:r.summary})});
      if(!saved.ok){const er=await saved.json().catch(()=>({}));throw new Error(er.message||'تعذّر حفظ المزامنة في SQLite')}
      durableSaved=true;
    } else throw new Error('يجب إكمال ترحيل البيانات إلى SQLite قبل اعتماد مزامنة الراوتر.');
    window.ADSL_APP.setState(r.state);
    const browserCacheSaved=window.ADSL_APP.save();
    if(!browserCacheSaved)r.localCacheWarning=true;
    {
      writeLastSync(r);
      window.ADSL_APP.render();
      const h=E('b',null,'اكتملت المزامنة وحُفظت في SQLite');box.append(h);if(r.localCacheWarning)box.append(E('div','wn','تعذّر تحديث نسخة المتصفح المؤقتة؛ البيانات الأساسية محفوظة في SQLite.'));
      box.append(E('div','mt','تاريخ القراءة: '+r.readOn+' ('+(r.dateSource==='router'?'من الراوتر':'من الهاتف')+')'));
      const dl=E('dl');
      const row=(k,v)=>dl.append(E('dt',null,k),E('dd',null,String(v)));
      row('أيام جديدة',r.summary.new);row('أيام تغيّرت',r.summary.updated);row('أيام ثُبّتت',r.summary.pinned);row('أيام مخفية أو غير مصنّفة',r.summary.hidden);
      row('بلا تغيير / نقصان غير مثبت',r.summary.unchanged);row('أيام مثبتة مسبقاً',r.summary.alreadyPinned);row('إدخال يدوي لم يُمسّ',r.summary.manual);
      box.append(dl);
      if(r.sanity&&r.sanity.available){
        const ratios=r.sanity.rows.filter(x=>x.ratio!=null);
        const high=ratios.filter(x=>x.ratio>1.05);
        box.append(E('div',high.length?'wn':'mt',high.length?'تنبيه فحص الاتساق: نسبة الاستهلاك تجاوزت الحد في '+high.map(x=>x.profile+' ('+x.ratio+')').join('، '):'فحص الاتساق: لم تظهر نسبة أعلى من الحدّ في الباقات ذات البيانات.'));
      }else box.append(E('div','wn','تعذّر فحص اتساق الاستهلاك: '+(r.sanity&&r.sanity.reason||'غير متاح')));
      if(r.warnings.length){const ul=E('ul','wn');r.warnings.forEach(w=>ul.append(E('li',null,w)));box.append(ul)}
      log('مزامنة كروت اليوزر مانجر: نجاح؛ جديد '+r.summary.new+'، تغيّر '+r.summary.updated+'، ثُبّت '+r.summary.pinned+'، مخفي '+r.summary.hidden);
    }
  }
  if(!r.ok){
    writeLastSync(r);
    if(dbStatus?.migrated){try{await fetch('/db/router-sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({days:[],attemptedAt:new Date().toISOString(),status:'error',errorCode:String(r.error&&r.error.code||'SYNC_FAILED').replace(/[^A-Z0-9_]/g,'').slice(0,50)||'SYNC_FAILED'})})}catch{}}
    window.ADSL_APP.render();
    box.classList.add('er');box.append(E('b',null,'فشلت المزامنة: '+(r.error.code||'SYNC_FAILED')),E('div',null,r.error.message||'حدث خطأ غير متوقع. لم تُحفظ أي قراءة.'));
    log('مزامنة كروت اليوزر مانجر: فشل ('+String(r.error.code||'SYNC_FAILED').replace(/[^A-Z_]/g,'')+')');
  }
}catch(e){
  // Once SQLite confirms the sync, never overwrite its success with a misleading failure.
  if(!durableSaved){
    writeLastSync({ok:false,error:{code:'UNKNOWN'}});
    if(dbStatus?.migrated){try{await fetch('/db/router-sync',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({days:[],attemptedAt:new Date().toISOString(),status:'error',errorCode:'PERSISTENCE_FAILED'})})}catch{}}
  }
  window.ADSL_APP.render();
  box.classList.add('er');
  box.append(E('b',null,durableSaved?'تم حفظ المزامنة في SQLite':'فشلت المزامنة'),E('div',null,durableSaved?'حُفظت البيانات بنجاح، لكن حدث خطأ لاحق أثناء تحديث الواجهة. أعد فتح الصفحة للتحقق من عرض البيانات.':'حدث خطأ غير متوقع قبل تأكيد الحفظ في SQLite.'));
  log(durableSaved?'مزامنة User Manager: تم الحفظ في SQLite، وحدث خطأ لاحق بالواجهة':'مزامنة كروت اليوزر مانجر: فشل (UNKNOWN)');
}finally{
  $('rw').value='';b.disabled=false;test.disabled=false;close.disabled=false;b.textContent='قراءة الكروت ومزامنتها';
  box.append(E('div','mt','تذكير أمني: عطّل خدمة API الآن من الراوتر بالأمر:'),E('small',null,'/ip service disable api'));
}
};
$('rt').onclick=async()=>{await logReady;if(APP_LOG)APP_LOG.addSecret($('rw').value);const b=$('rt'),o=$('rr');b.disabled=true;b.textContent='جارٍ الاختبار…';o.replaceChildren();let r;
try{r=await window.ADSL_LINK.testConnection({host:$('rh').value,port:$('rp').value,user:$('ru').value,password:$('rw').value})}
catch(e){r={ok:false,error:{code:'UNKNOWN',message:'حدث خطأ غير متوقع أثناء الاختبار.',technical:''}}}
const box=E('div','rs '+(r.ok?'ok':'er'));
if(r.ok){const s=r.system,a=r.api,dl=E('dl'),row=(k,v)=>dl.append(E('dt',null,k),E('dd',null,v==null||v===''?'—':String(v)));
box.append(E('b',null,r.v6?'الاتصال ناجح (RouterOS v6)':'الاتصال ناجح'));
row('اسم الراوتر',s.identity);row('الموديل',s.board);row('الإصدار',s.version);row('مدة التشغيل',s.uptimeRaw);
row('خدمة API',a?(a.disabled?'معطلة':'مفعلة، المنفذ '+a.port):null);row('المسموح له بـ API',a?(a.address||'كل العناوين (غير مقيّد)'):null);box.append(dl);
if(!r.v6)box.append(E('div','wn','الإصدار '+(s.version||'غير معروف')+' وليس v6، والتطبيق مصمم لـ RouterOS v6.'));
if(a&&!a.address)box.append(E('div','wn','خدمة API غير مقيّدة بعنوان. قيّدها بشبكتك المحلية.'));
if(r.apiNote)box.append(E('div','wn',r.apiNote));
box.append(E('div','mt','بعد الانتهاء عطّل خدمة API في الراوتر بالأمر:'),E('small',null,'/ip service disable api'))}
else{const er=r.error;box.append(E('b',null,er.code=='BAD_INPUT'?'تحقق من المدخلات':'فشل الاتصال'),E('div',null,er.message));
if(er.code!='BAD_INPUT')box.append(E('small',null,er.code+(er.technical?': '+er.technical:'')))}
o.append(box);
log('اختبار اتصال الراوتر: '+(r.ok?'نجح':'فشل ('+String(r.error.code).replace(/[^A-Z_]/g,'')+')'));
b.disabled=false;b.textContent='اختبار الاتصال'}}
A.rtr=openRtr;window.addEventListener('adsl-link',()=>render());
// Wait for the SQLite balance read before showing editable screens, avoiding a race at startup.
refreshDbStatus();
logReady.then(()=>{if(tab==='tools')render()});
window.ADSL_APP={KEY,getState:()=>S,setState:v=>{S=v},save,render,toast,log};
</script>
<script type="module" src="/www/link.js"></script>

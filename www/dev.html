<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050A1B">
<title>اختبار الراوتر (أداة مطوّر)</title>
<style>
:root{--bg:#050A1B;--sf:#10182F;--bl:#287BFF;--cy:#20C9F5;--tx:#F5F7FF;--mu:#929FBD;--gn:#20D6A0;--rd:#F05275;--am:#FFB84D;--bd:rgba(40,123,255,.25);color-scheme:dark;box-sizing:border-box;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "IBM Plex Sans Arabic",Cairo,system-ui,sans-serif;padding:14px}
h1{font-size:18px;margin:0 0 4px}
.note{color:var(--mu);font-size:13px;margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:14px;margin-bottom:12px}
label{display:block;color:var(--mu);font-size:12px;margin:8px 0 3px}
input{width:100%;background:#0A1230;border:1px solid var(--bd);border-radius:12px;color:var(--tx);padding:10px;font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:14px;padding:11px 14px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--bl),var(--cy))}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button:disabled{opacity:.5}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mu);font-weight:600}
.b{border-radius:8px;padding:1px 8px;font-size:12px}
.ok{background:rgba(32,214,160,.15);color:var(--gn)}.err{background:rgba(240,82,117,.15);color:var(--rd)}.warn{background:rgba(255,184,77,.15);color:var(--am)}.mu{background:rgba(146,159,189,.15);color:var(--mu)}
#msg{min-height:22px;font-weight:600}
#log{max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,monospace;color:var(--mu);direction:rtl;white-space:pre-wrap}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}dt{color:var(--mu)}dd{margin:0}
</style>
</head>
<body>
<h1>اختبار الاتصال بالراوتر</h1>
<p class="note">أداة تجريبية للمطوّر وليست واجهة التطبيق. تتصل عبر جسر Termux. القراءة فقط، ولا تُعدّل أي إعداد في الراوتر. كلمة المرور لا تُحفظ.</p>

<div class="card">
  <div class="row"><div><label>عنوان الراوتر</label><input id="host" inputmode="decimal" placeholder="192.168.88.1" autocomplete="off"></div>
  <div><label>المنفذ</label><input id="port" inputmode="numeric" value="8728"></div></div>
  <div class="row"><div><label>المستخدم</label><input id="user" autocomplete="off" autocapitalize="off"></div>
  <div><label>كلمة المرور</label><input id="pass" type="password" autocomplete="off"></div></div>
  <label style="display:flex;gap:8px;align-items:center"><input id="tls" type="checkbox" style="width:auto"> API-SSL (8729) — غير مُختبَر</label>
  <div class="btns">
    <button id="bTest">اختبار الاتصال</button>
    <button id="bDisc" class="sec">اكتشاف الواجهات</button>
    <button id="bRead">قراءة وتسجيل</button>
    <button id="bClear" class="sec">مسح السجل التجريبي</button>
  </div>
</div>

<div class="card"><div id="msg"></div><div id="out"></div></div>
<div class="card"><div style="color:var(--mu);font-size:12px;margin-bottom:6px">سجل العمليات</div><div id="log"></div></div>

<script type="module">
import { RouterOSClient, readSystem, readApiService, discoverInterfaces, diagnose } from '/core/routeros-api.js';
import { BridgeTransport } from '/core/bridge-transport.js';
import { takeReading } from '/core/reader.js';
import { appendReading, formatBytes, STATUS } from '/core/counters.js';

const $ = (id) => document.getElementById(id);
const HKEY = 'adsl-dev-history', LKEY = 'adsl-dev-log', PKEY = 'adsl-dev-conn';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* ممنوع التخزين */ } },
};
let history = store.get(HKEY, []);
let logLines = store.get(LKEY, []);
const conn = store.get(PKEY, {});
for (const k of ['host', 'port', 'user']) if (conn[k]) $(k).value = conn[k];

function log(text, cls) {
  const t = new Date().toLocaleTimeString('en-GB');
  logLines.push(`[${t}] ${cls === 'err' ? '✗' : cls === 'ok' ? '✓' : '·'} ${text}`);
  logLines = logLines.slice(-200);
  store.set(LKEY, logLines);
  $('log').textContent = logLines.join('\n');
  $('log').scrollTop = 1e9;
}
function msg(text, cls) { const m = $('msg'); m.textContent = text; m.style.color = cls === 'err' ? 'var(--rd)' : cls === 'ok' ? 'var(--gn)' : 'var(--tx)'; }
function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function badge(text, cls) { return el('span', text, 'b ' + cls); }
function table(headers, rows) {
  const t = el('table'), hr = el('tr');
  headers.forEach((h) => hr.append(el('th', h))); t.append(hr);
  for (const r of rows) { const tr = el('tr'); r.forEach((c) => { const td = el('td'); c instanceof Node ? td.append(c) : (td.textContent = c); tr.append(td); }); t.append(tr); }
  const w = el('div', undefined, 'tbl'); w.append(t); return w;
}
function render(...nodes) { $('out').replaceChildren(...nodes); }

async function withRouter(fn) {
  const host = $('host').value.trim(), port = Number($('port').value) || (($('tls').checked) ? 8729 : 8728), user = $('user').value.trim(), pass = $('pass').value;
  if (!host || !user) { msg('أدخل عنوان الراوتر واسم المستخدم', 'err'); return; }
  store.set(PKEY, { host, port, user });
  const c = new RouterOSClient(new BridgeTransport(''), { timeoutMs: 10000 });
  document.querySelectorAll('button').forEach((b) => (b.disabled = true));
  try {
    log(`اتصال بـ ${host}:${port}`);
    await c.connect({ host, port, tls: $('tls').checked });
    await c.login(user, pass);
    log('تسجيل الدخول نجح', 'ok');
    return await fn(c);
  } catch (e) {
    const d = diagnose(e);
    msg(d.message, 'err'); render();
    log(`فشل (${d.code}): ${d.technical || ''}`, 'err');
    return null;
  } finally {
    await c.close();
    document.querySelectorAll('button').forEach((b) => (b.disabled = false));
  }
}

$('bTest').onclick = () => withRouter(async (c) => {
  const s = await readSystem(c);
  const svc = await readApiService(c);
  const dl = el('dl');
  const add = (k, v) => { dl.append(el('dt', k), el('dd', v == null || v === '' ? '—' : String(v))); };
  add('اسم الراوتر', s.identity); add('الإصدار', s.version); add('الموديل', s.board);
  add('مدة التشغيل', s.uptimeRaw); add('الوقت', s.clock && `${s.clock.date} ${s.clock.time}`); add('المنطقة الزمنية', s.clock && s.clock.timeZone);
  add('خدمة API', svc.api ? (svc.api.disabled ? 'معطلة' : `مفعلة، المنفذ ${svc.api.port}`) : 'غير موجودة');
  add('المسموح له بـ API', svc.api && (svc.api.address || 'كل العناوين (غير مقيّد)'));
  render(dl);
  const v6 = /^6\./.test(s.version || '');
  msg(v6 ? 'الاتصال ناجح (RouterOS v6)' : `الاتصال ناجح، لكن الإصدار ${s.version} وليس v6`, v6 ? 'ok' : 'err');
  log(`اختبار ناجح: ${s.identity} / ${s.version}`, 'ok');
});

const kindAr = { ethernet: 'Ethernet', vlan: 'VLAN', bridge: 'Bridge', other: 'أخرى' };
$('bDisc').onclick = () => withRouter(async (c) => {
  const { interfaces, warnings } = await discoverInterfaces(c);
  render(table(['الاسم', 'النوع', 'الحالة', 'VLAN', 'الأب/الجسر', 'RX', 'TX'], interfaces.map((i) => [
    i.name, kindAr[i.kind] + (i.kind === 'other' ? ` (${i.type})` : ''),
    i.disabled ? badge('معطلة', 'mu') : i.running ? badge('تعمل', 'ok') : badge('لا رابط', 'warn'),
    i.vlanId ?? '—', i.parent || i.bridge || '—',
    i.rx === null ? badge('غير متاح', 'err') : formatBytes(i.rx), i.tx === null ? badge('غير متاح', 'err') : formatBytes(i.tx)])));
  msg(`اكتُشفت ${interfaces.length} واجهة`, 'ok');
  warnings.forEach((w) => log(w, 'err'));
  log(`اكتشاف: ${interfaces.length} واجهة`, 'ok');
});

const stAr = { ok: ['استهلاك', 'ok'], first: ['نقطة مرجعية', 'mu'], new: ['واجهة جديدة', 'mu'], reset: ['تصفير/إعادة تشغيل', 'warn'], invalid: ['قيمة غير صالحة', 'err'] };
$('bRead').onclick = () => withRouter(async (c) => {
  const { reading, interfaces, warnings } = await takeReading(c);   // يرمي عند أي فشل: لا قراءة جزئية
  const r = appendReading(history, reading);
  warnings.forEach((w) => log(w, 'err'));
  if (r.duplicate) { msg('هذه القراءة مسجلة سابقاً، لم تُضف', 'err'); return; }
  history = r.history; store.set(HKEY, history);
  const p = r.period, by = Object.fromEntries(interfaces.map((i) => [i.name, i]));
  const rows = Object.entries(p.results).map(([n, x]) => {
    const [t, cls] = stAr[x.status];
    return [n, kindAr[(by[n] || {}).kind] || '—', badge(t + (x.reason ? ` (${x.reason})` : ''), cls),
      x.total === null ? '—' : formatBytes(x.rx), x.total === null ? '—' : formatBytes(x.tx), x.total === null ? '—' : formatBytes(x.total)];
  });
  render(table(['الواجهة', 'النوع', 'الحالة', 'RX للفترة', 'TX للفترة', 'الإجمالي'], rows));
  if (p.missing.length) log(`واجهات غابت عن القراءة (لا تُحسب أصفاراً): ${p.missing.join(', ')}`, 'err');
  if (p.reboot.rebooted) log(`اكتُشفت إعادة تشغيل للراوتر (${p.reboot.reason})`, 'ok');
  const isFirst = history.length === 1;
  msg(isFirst ? 'سُجلت أول قراءة كنقطة مرجعية. اقرأ مرة أخرى لاحقاً لرؤية الاستهلاك.' : `سُجلت القراءة رقم ${history.length}`, 'ok');
  log(`قراءة مسجلة: ${Object.keys(reading.ifaces).length} واجهة، غير صالحة: ${reading.invalid.length}`, 'ok');
});

$('bClear').onclick = () => { history = []; store.set(HKEY, history); render(); msg('مُسح السجل التجريبي (قراءات الاختبار فقط)', 'ok'); log('مسح السجل التجريبي'); };

$('log').textContent = logLines.join('\n');
if (history.length) msg(`يوجد ${history.length} قراءة محفوظة من اختبارات سابقة`, '');
</script>
</body>
</html>
